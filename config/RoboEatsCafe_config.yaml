world:
  height: 13.0
  width: 13.0
  step_time: 0.1
  sample_time: 0.1
  collision_mode: 'unobstructed' 

robot:
  - number: 2
    distribution: {name: 'manual'}
    state:
      - [7, 1.75, 3.14]  # Robot 1 start position
      - [7, 1, 3.14 ]    # Robot 2 start position
    shape: {name: 'circle', radius: 0.15}
    kinematics: {name: 'diff'}
    behavior: {name: 'rvo', vxmax: 1.2, vymax: 1.2, acce: 1.0, factor: 1.0}
    arrive_mode: position
    goal_threshold: 0.15
    vel_min: [-3, -3.0]
    vel_max: [3, 3.0]
    color: 
      - 'darkblue'
      - 'darkgreen'
    plot:
      show_trajectory: True
      show_goal: False
      
# Wall, kitchen, and tables
obstacle:
  # Top wall
  - shape: {name: 'rectangle', length: 13, width: 0.1}
    state: [6.5, 12.95, 0]
  
  # Bottom wall
  - shape: {name: 'rectangle', length: 13, width: 0.1}
    state: [6.5, 0.05, 0]
  
  # Left wall
  - shape: {name: 'rectangle', length: 0.1, width: 13}
    state: [0.05, 6.5, 0]
  
  # Right walls
  - shape: {name: 'rectangle', length: 0.1, width: 9}
    state: [12.95, 4.5, 0]
  - shape: {name: 'rectangle', length: 0.1, width: 2}
    state: [12.95, 12, 0]

  # Kitchen
  - shape: {name: 'rectangle', length: 5, width: 1}
    state: [10, 1.5, 0]
    color: 'grey'

  # 20 chairs
  - number: 20
    distribution: {name: 'manual'}
    state: [
      [2, 4.75], [2, 7.75], [2, 10.75], [2, 1.75], 
      [2, 5.25], [2, 8.25], [2, 11.25], [2, 2.25], 
      [6, 4.75], [6, 7.75], [6, 10.75], 
      [6, 5.25], [6, 8.25], [6, 11.25], 
      [10, 4.75], [10, 7.75], [10, 10.75], 
      [10, 5.25], [10, 8.25], [10, 11.25]
    ]
    shape:
      - {name: 'circle', radius: 0.2}
    color: 'brown' 

  # 10 tables
  - number: 10
    distribution: {name: 'manual'}
    state: [
      [2, 5], [2, 8], [2, 11], [2, 2],
      [6, 5], [6, 8], [6, 11],
      [10, 5], [10, 8], [10, 11] 
    ]
    shape:
      - {name: 'rectangle', length: 1.5, width: 0.5}
    color: 'grey'

